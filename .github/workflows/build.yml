name: build

on:
  push:
    branches: [main]
  schedule:
    # Weekly rebuild on top of the upstream CNPG postgres image to pick up
    # postgres minor patches and timescaledb point releases.
    - cron: "0 6 * * 1"
  workflow_dispatch:
    inputs:
      pg_major:
        description: "Postgres major version"
        default: "17"
      timescale_version:
        description: "TimescaleDB version (e.g. 2.25)"
        default: "2.31"

env:
  REGISTRY: registry.digitalocean.com/jar-containers
  # Public mirror of the same image: no pull secret needed (customer sites pull from here)
  GHCR: ghcr.io/joyautomation
  IMAGE_NAME: cnpg-timescaledb
  PG_MAJOR: ${{ github.event.inputs.pg_major || '17' }}
  TIMESCALE_VERSION: ${{ github.event.inputs.timescale_version || '2.31' }}

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # DO is optional: an expired DIGITALOCEAN_ACCESS_TOKEN must not stop the public GHCR
      # image (it did on 2026-11-12). The step summary says when DO was skipped.
      - name: Log in to DO container registry
        id: do_login
        continue-on-error: true
        uses: docker/login-action@v3
        with:
          registry: registry.digitalocean.com
          username: ${{ secrets.DIGITALOCEAN_ACCESS_TOKEN }}
          password: ${{ secrets.DIGITALOCEAN_ACCESS_TOKEN }}

      - name: Resolve tags
        id: tags
        env:
          DO_OK: ${{ steps.do_login.outcome == 'success' }}
        run: |
          d=$(date -u +%Y%m%d)
          v="${PG_MAJOR}-ts${TIMESCALE_VERSION}"
          regs="$GHCR"
          if [ "$DO_OK" = true ]; then regs="$regs $REGISTRY"
          else echo "::warning::DO login failed (DIGITALOCEAN_ACCESS_TOKEN): pushed to GHCR only" ; fi
          {
            echo "list<<EOF"
            for r in $regs; do
              printf '%s\n' "$r/$IMAGE_NAME:$v" "$r/$IMAGE_NAME:$v-$d" "$r/$IMAGE_NAME:$v-$d-$GITHUB_SHA"
            done
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Build & push
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          build-args: |
            PG_MAJOR=${{ env.PG_MAJOR }}
            TIMESCALE_VERSION=${{ env.TIMESCALE_VERSION }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.description=CloudNativePG PostgreSQL ${{ env.PG_MAJOR }} + TimescaleDB ${{ env.TIMESCALE_VERSION }}
          tags: ${{ steps.tags.outputs.list }}
