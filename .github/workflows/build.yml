name: build

on:
  push:
    branches: [main]
  schedule:
    # Weekly rebuild on top of the upstream CNPG postgres image to pick up
    # postgres minor patches and timescaledb point releases.
    - cron: "0 6 * * 1"
  workflow_dispatch:
    inputs:
      pg_major:
        description: "Postgres major version"
        default: "17"
      timescale_version:
        description: "TimescaleDB version (e.g. 2.25)"
        default: "2.25"

env:
  REGISTRY: registry.digitalocean.com/jar-containers
  IMAGE_NAME: cnpg-timescaledb
  PG_MAJOR: ${{ github.event.inputs.pg_major || '17' }}
  TIMESCALE_VERSION: ${{ github.event.inputs.timescale_version || '2.25' }}

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Log in to DO container registry
        uses: docker/login-action@v3
        with:
          registry: registry.digitalocean.com
          username: ${{ secrets.DIGITALOCEAN_ACCESS_TOKEN }}
          password: ${{ secrets.DIGITALOCEAN_ACCESS_TOKEN }}

      - name: Resolve build date
        id: date
        run: echo "value=$(date -u +%Y%m%d)" >> "$GITHUB_OUTPUT"

      - name: Build & push
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          build-args: |
            PG_MAJOR=${{ env.PG_MAJOR }}
            TIMESCALE_VERSION=${{ env.TIMESCALE_VERSION }}
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ env.PG_MAJOR }}-ts${{ env.TIMESCALE_VERSION }}
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ env.PG_MAJOR }}-ts${{ env.TIMESCALE_VERSION }}-${{ steps.date.outputs.value }}
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ env.PG_MAJOR }}-ts${{ env.TIMESCALE_VERSION }}-${{ steps.date.outputs.value }}-${{ github.sha }}
